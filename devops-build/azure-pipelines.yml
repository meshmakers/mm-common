# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)

resources:
  repositories:
    # Only for the redundant-run guard (AB#6439); the other steps still use the local templates of
    # this folder until AB#6394 moves the repo to the shared step templates.
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.7.0

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - main
  tags:
    exclude:
      - '*'

pool:
  name: meshmakers-ci-agents

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solution
    value: '**/*.sln'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

steps:
# Redundant-run guard (AB#6439, AB#6344): mm-common is the root of the library chain. The guard publishes this
# run's own input fingerprint as the build tag inputs:<hash> = sha256(own commit | 'root'); DEH reads it as the
# parent fingerprint, so the whole chain below gets identical fingerprints for identical inputs across waves.
# Mode by the pipeline variable CiGuardMode (unset = report: tags only; cancel = a duplicate or superseded
# main run cancels itself; off = disabled). Fail-open, main only. No later step needs a condition in
# report / cancel mode.
- template: templates/steps/guard-redundant-run.yml@pipelineTemplates
- template: update-build-number.yml
- template: set-version.yml
- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: 'build'
    arguments: '--configuration $(buildConfiguration)'
    projects: '$(solution)'
- task: DotNetCoreCLI@2
  displayName: Tests
  inputs:
    command: 'test'
    arguments: '--configuration $(buildConfiguration)'
    projects: '$(solution)'
- template: handle-artifacts.yml
- template: push-nuget-package.yml
